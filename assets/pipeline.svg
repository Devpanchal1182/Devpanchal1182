<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Workflow: Design, Data, Impact, Decision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1a20"/>
      <stop offset="1" stop-color="#10333a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect width="1200" height="250" rx="18" fill="url(#bg)"/>
  <text x="600" y="40" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="2">HOW I WORK: FROM DESIGN TO DECISION</text>

  <!-- connectors -->
  <g stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)">
    <path d="M285 140H325"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M575 140H615"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M865 140H905"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.5s" repeatCount="indefinite"/></path>
  </g>

  <!-- travelling dots -->
  <g fill="#5eead4" filter="url(#glow)">
    <circle r="5"><animateMotion dur="5s" repeatCount="indefinite" path="M285 140H1060"/></circle>
    <circle r="5"><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M285 140H1060"/></circle>
    <circle r="5"><animateMotion dur="5s" begin="3.3s" repeatCount="indefinite" path="M285 140H1060"/></circle>
  </g>

  <!-- node 1 -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="85" width="245" height="110" rx="14" fill="#0f2f33" stroke="#2dd4bf" stroke-width="2"/>
      <text x="162" y="123" font-size="22" font-weight="700" fill="#ffffff">⚙ Design</text>
      <text x="162" y="150" font-size="14" fill="#94a3b8">CAD · drawings</text>
      <text x="162" y="172" font-size="14" fill="#94a3b8">verification · documentation</text>
      <animate attributeName="opacity" values="1;0.65;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="325" y="85" width="250" height="110" rx="14" fill="#0f2f33" stroke="#14b8a6" stroke-width="2"/>
      <text x="450" y="123" font-size="22" font-weight="700" fill="#ffffff">🐍 Data</text>
      <text x="450" y="150" font-size="14" fill="#94a3b8">Python · Pandas · NumPy</text>
      <text x="450" y="172" font-size="14" fill="#94a3b8">validation · clean inputs</text>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="615" y="85" width="250" height="110" rx="14" fill="#0f2f33" stroke="#2dd4bf" stroke-width="2"/>
      <text x="740" y="123" font-size="22" font-weight="700" fill="#ffffff">♻ Impact</text>
      <text x="740" y="150" font-size="14" fill="#94a3b8">LCA screening · carbon</text>
      <text x="740" y="172" font-size="14" fill="#94a3b8">material flows · circularity</text>
      <animate attributeName="opacity" values="1;0.65;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="905" y="85" width="255" height="110" rx="14" fill="#0f2f33" stroke="#14b8a6" stroke-width="2"/>
      <text x="1032" y="123" font-size="22" font-weight="700" fill="#ffffff">📊 Decision</text>
      <text x="1032" y="150" font-size="14" fill="#94a3b8">scenarios · trade-offs</text>
      <text x="1032" y="172" font-size="14" fill="#94a3b8">clear charts · stated limits</text>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="600" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#64748b">every step: documented assumptions · stated units · tested calculations</text>
</svg>
