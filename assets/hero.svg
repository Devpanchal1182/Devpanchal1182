<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Animated banner: Mechanical Engineering, Sustainability and Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a20"/>
      <stop offset="0.55" stop-color="#0f2f33"/>
      <stop offset="1" stop-color="#14524c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Gears (mechanical engineering) -->
  <g transform="translate(110 215)" filter="url(#glow)">
    <g>
      <circle r="46" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-dasharray="11.1 11.1"/>
      <circle r="34" fill="#0f2f33" stroke="#2dd4bf" stroke-width="3"/>
      <circle r="9" fill="none" stroke="#5eead4" stroke-width="3"/>
      <path d="M0 -30V30M-30 0H30" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(196 262)" filter="url(#glow)">
    <g>
      <circle r="28" fill="none" stroke="#14b8a6" stroke-width="10" stroke-dasharray="11 11"/>
      <circle r="20" fill="#0f2f33" stroke="#14b8a6" stroke-width="3"/>
      <circle r="6" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Leaf (sustainability) -->
  <g transform="translate(120 85)" filter="url(#glow)">
    <path d="M0 40 C-6 8 14 -22 52 -26 C50 12 28 40 0 40 Z" fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 40 C14 20 28 6 44 -14" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="120 85;120 78;120 85" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Title block -->
  <text x="290" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="1">
    DEV PANCHAL
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="292" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2dd4bf" letter-spacing="0.5">
    Mechanical Engineering  ×  Sustainability  ×  Python
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Rotating taglines -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#cbd5e1">
    <text x="292" y="218">▸ Circular economy &amp; life cycle thinking
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="292" y="218">▸ From CAD drawings to data-driven decisions
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="292" y="218">▸ Transparent, tested, reproducible analysis
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.96;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="292" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
    M.Sc. Sustainability Management &amp; Technologies · Technische Hochschule Ingolstadt · Germany
  </text>

  <!-- Decorative data panel (illustrative graphic, not real data) -->
  <g transform="translate(820 60)">
    <rect width="320" height="200" rx="12" fill="#0b1a20" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <path d="M20 160H300M20 20V160" stroke="#64748b" stroke-width="1.2"/>
    <g stroke="#2dd4bf" stroke-opacity="0.12">
      <path d="M20 120H300M20 80H300M20 40H300"/>
    </g>

    <!-- bars -->
    <g fill="#14b8a6" fill-opacity="0.55">
      <rect x="44" width="30" y="110" height="50"><animate attributeName="height" values="20;50;20" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="140;110;140" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="94" width="30" y="90" height="70"><animate attributeName="height" values="40;70;40" dur="5.6s" repeatCount="indefinite"/><animate attributeName="y" values="120;90;120" dur="5.6s" repeatCount="indefinite"/></rect>
      <rect x="144" width="30" y="70" height="90"><animate attributeName="height" values="60;90;60" dur="6.2s" repeatCount="indefinite"/><animate attributeName="y" values="100;70;100" dur="6.2s" repeatCount="indefinite"/></rect>
      <rect x="194" width="30" y="55" height="105"><animate attributeName="height" values="70;105;70" dur="5.2s" repeatCount="indefinite"/><animate attributeName="y" values="90;55;90" dur="5.2s" repeatCount="indefinite"/></rect>
      <rect x="244" width="30" y="40" height="120"><animate attributeName="height" values="80;120;80" dur="6.6s" repeatCount="indefinite"/><animate attributeName="y" values="80;40;80" dur="6.6s" repeatCount="indefinite"/></rect>
    </g>

    <!-- trend line (declining footprint idea) -->
    <path d="M30 40 L90 62 L150 80 L210 112 L270 132" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="320;0;0;320" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <g fill="#5eead4">
      <circle cx="30" cy="40" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="62" r="4"><animate attributeName="r" values="3;6;3" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="80" r="4"><animate attributeName="r" values="3;6;3" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="112" r="4"><animate attributeName="r" values="3;6;3" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="132" r="4"><animate attributeName="r" values="3;6;3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="20" y="186" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#64748b">illustrative graphic</text>
  </g>

  <!-- Moving scan line -->
  <rect x="0" y="0" width="3" height="320" fill="#2dd4bf" fill-opacity="0.18">
    <animate attributeName="x" values="0;1200" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
